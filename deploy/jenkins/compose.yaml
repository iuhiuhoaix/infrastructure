# Jenkins Controller — 独立 Compose，无内部 DB 依赖
# 端口策略（现阶段：无外网地址，走内网直连 0.0.0.0，对齐 GitLab 8080 / Plane 3000）：
#   - 8082:8080 → Web UI（内网直连；等有外网地址再改回 127.0.0.1 + Nginx 反代）
#   - 50000 端口仅内部 devops-internal（inbound agent 历史 TCP；推荐改 WebSocket 走 443）
# Agent：Linux Docker Agent 同 Host 容器；Windows Agent 独立 Server，WebSocket inbound
services:
  jenkins:
    image: jenkins/jenkins:2.568.2-jdk21@sha256:8547df3b0db2803d158ecc9499207a056bb30c23fddc18bb5b4a4dc14e77dd09   # 2.568.2 LTS（=迁移数据来源版本，jdk21；勿降到 lts-jdk17/2.541.3，会插件全挂）
    container_name: jenkins
    restart: unless-stopped
    hostname: jenkins
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false -Duser.timezone=Asia/Shanghai"   # false：迁移场景，JENKINS_HOME 已有全套配置，禁止弹安装向导
      # 反代相关
      JENKINS_OPTS: "--httpPort=8080 --prefix=/"
    env_file: .env
    ports:
      - "8082:8080"   # Web UI，内网直连（暂不绑 127.0.0.1，Nginx 未上）
    volumes:
      - ./data:/var/jenkins_home:Z   # :Z — SELinux Enforcing 下容器可写（Fedora）
      # 可选：让 Controller 能触发 Docker 构建（Linux Agent 模式）
      # - /var/run/docker.sock:/var/run/docker.sock
    networks:
      devops-internal:
        aliases:
          - jenkins

networks:
  devops-internal:
    external: true
