# Jenkins Controller — 独立 Compose，无内部 DB 依赖
# 端口策略（现阶段：无外网地址，走内网直连 0.0.0.0，对齐 GitLab 8080 / Plane 3000）：
#   - 8082:8080 → Web UI（内网直连；等有外网地址再改回 127.0.0.1 + Nginx 反代）
#   - 50000 端口仅内部 devops-internal（inbound agent 历史 TCP；推荐改 WebSocket 走 443）
# Agent：Linux Docker Agent 同 Host 容器；Windows Agent 独立 Server，WebSocket inbound
services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17@sha256:cce1eeb79902722f3cf7a8831c41e95c39f4a42b9a2981959630cc66539b3c2d   # 2.541.3 LTS（2026-08-17 锁定）
    container_name: jenkins
    restart: unless-stopped
    hostname: jenkins
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=true -Duser.timezone=Asia/Shanghai"
      # 反代相关
      JENKINS_OPTS: "--httpPort=8080 --prefix=/"
    env_file: .env
    ports:
      - "8082:8080"   # Web UI，内网直连（暂不绑 127.0.0.1，Nginx 未上）
    volumes:
      - ./data:/var/jenkins_home
      # 可选：让 Controller 能触发 Docker 构建（Linux Agent 模式）
      # - /var/run/docker.sock:/var/run/docker.sock
    networks:
      devops-internal:
        aliases:
          - jenkins

networks:
  devops-internal:
    external: true
