# Nginx 反向代理配置（宿主机运行）
# 落地位置：/opt/devops/nginx/conf.d/  →  nginx.conf 里 include 此目录
# 证书：certbot --nginx 自动签发，存 /etc/letsencrypt
# 策略：所有 Web 流量经此入口；内部容器间走 devops-internal 容器名直连
# WebSocket：每个 location 都加 Upgrade 头（GitLab/Jenkins/Plane/RagFlow 都用 WS）

# ---------- 通用 WebSocket / 反代头 ----------
# 建议放进 nginx.conf 的 http{} 或单独 map，此处为各 server 自包含示例

# ========== GitLab ==========
server {
    listen 443 ssl http2;
    server_name git.example.com;
    ssl_certificate     /etc/letsencrypt/live/git.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/git.example.com/privkey.pem;

    client_max_body_size 0;   # 允许大仓库/制品上传
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ========== GitLab Container Registry（如用 GitLab 内置 Registry）==========
server {
    listen 443 ssl http2;
    server_name reg.git.example.com;
    ssl_certificate     /etc/letsencrypt/live/reg.git.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reg.git.example.com/privkey.pem;

    client_max_body_size 0;   # Registry 必须关闭大小限制
    chunked_transfer_encoding on;

    location / {
        proxy_pass http://127.0.0.1:8080;   # GitLab 内置 registry 也走 80
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# ========== Plane ==========
server {
    listen 443 ssl http2;
    server_name plane.example.com;
    ssl_certificate     /etc/letsencrypt/live/plane.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plane.example.com/privkey.pem;

    client_max_body_size 50m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ========== Jenkins ==========
server {
    listen 443 ssl http2;
    server_name jenkins.example.com;
    ssl_certificate     /etc/letsencrypt/live/jenkins.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jenkins.example.com/privkey.pem;

    client_max_body_size 50m;
    proxy_read_timeout 3600s;   # 长构建日志流
    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ========== Nexus Web UI + 依赖仓库 ==========
server {
    listen 443 ssl http2;
    server_name nexus.example.com;
    ssl_certificate     /etc/letsencrypt/live/nexus.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexus.example.com/privkey.pem;

    client_max_body_size 1g;    # 大制品/包上传
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# ========== Nexus Docker Registry（独立子域名）==========
server {
    listen 443 ssl http2;
    server_name reg.example.com;
    ssl_certificate     /etc/letsencrypt/live/reg.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reg.example.com/privkey.pem;

    client_max_body_size 0;     # docker push 必须关闭
    chunked_transfer_encoding on;

    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# ========== RagFlow ==========
server {
    listen 443 ssl http2;
    server_name rag.example.com;
    ssl_certificate     /etc/letsencrypt/live/rag.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rag.example.com/privkey.pem;

    client_max_body_size 100m;  # 文档上传
    location / {
        proxy_pass http://127.0.0.1:9380;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ========== HTTP → HTTPS 跳转（全局）==========
server {
    listen 80;
    server_name git.example.com reg.git.example.com plane.example.com jenkins.example.com nexus.example.com reg.example.com rag.example.com;
    return 301 https://$host$request_uri;
}
