# Plane 统一入口 nginx 配置（plane-web 容器，覆盖镜像内置配置）
# 新版 Plane(1.4+) 是微服务前端：web/admin/space/live 各自独立镜像，统一经此前缀路由：
#   /          → plane-web 静态（主应用）
#   /api/      → plane-api:8000   （后端 API）
#   /auth/     → plane-api:8000   （OAuth 回调）
#   /god-mode/ → plane-admin:3000 （实例设置/onboarding，资源带 /god-mode/ 前缀）
#   /spaces/   → plane-space:3000 （公开空间）
#   /live/     → plane-live:3000  （实时协作 WebSocket）
worker_processes 4;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type  application/octet-stream;

  set_real_ip_from        0.0.0.0/0;
  real_ip_recursive       on;
  real_ip_header          X-Forwarded-For;
  limit_req_zone          $binary_remote_addr zone=mylimit:10m rate=10r/s;

  access_log /dev/stdout;
  error_log /dev/stderr;

  server {
    listen 3000;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 无尾斜杠补正
    location = /god-mode { return 301 /god-mode/; }
    location = /spaces    { return 301 /spaces/; }

    # API 反代到 backend（保留 URI，相对路径 /api/ 直达）
    location /api/ {
      proxy_pass http://plane-api:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 300s;
    }

    # OAuth 回调
    location /auth/ {
      proxy_pass http://plane-api:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # God mode（admin 前端，资源引用带 /god-mode/ 前缀，保留 URI 透传）
    location /god-mode/ {
      proxy_pass http://plane-admin:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    # 公开空间
    location /spaces/ {
      proxy_pass http://plane-space:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    # 实时协作（WebSocket）
    location /live/ {
      proxy_pass http://plane-live:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 3600s;
    }

    # MinIO 对象存储（bucket 路径：上传走预签名 URL + 图片访问直通，USE_MINIO=1 时 S3 指向本 host）
    # 注意：预签名上传 URL 是 /plane（无尾斜杠），必须精确匹配反代，不能让它落 try_files 被 301 到 /plane/
    location = /plane {
      proxy_pass http://minio:9000;
      proxy_set_header Host $host;          # 保留原始 Host，保证 S3 签名校验通过
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      client_max_body_size 0;               # 上传不限制大小
    }
    location /plane/ {
      proxy_pass http://minio:9000;
      proxy_set_header Host $host;          # 保留原始 Host，保证 S3 签名校验通过
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      client_max_body_size 0;               # 上传不限制大小
    }

    # 主应用静态资源
    location / {
      root   /usr/share/nginx/html;
      index  index.html index.htm;
      try_files $uri $uri/ /index.html;
    }
  }
}
