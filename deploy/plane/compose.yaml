# Plane (项目管理) — 独立 Compose，内部依赖自管（PG+Redis+RabbitMQ+MinIO）
# 端口策略：
#   - 3000:3000 → Web 统一入口（内网直连，对齐 GitLab；接 Nginx 反代后改回 127.0.0.1:3000）
# 网络：plane-web 挂 devops-internal + default；其余服务/依赖锁 default
# 数据：bind mount 到 ${PLANE_DATA_DIR:-./data}（.env 设 /dockerData/plane，与 GitLab 对齐）
#
# 前端 4 服务（微服务拆分，统一经 plane-web nginx 前缀路由）：
#   plane-web     makeplane/plane-frontend  主应用 /，nginx 静态
#   plane-admin   makeplane/plane-admin     /god-mode/（onboarding/实例设置）
#   plane-space   makeplane/plane-space     /spaces/（公开空间）
#   plane-live    makeplane/plane-live      /live/（实时协作 WS）
#
# 后端 4 服务（同镜像 makeplane/plane-backend，不同 command，对齐官方 selfhost）：
#   plane-api       ./bin/docker-entrypoint-api.sh      （gunicorn/ASGI Web）
#   plane-worker    ./bin/docker-entrypoint-worker.sh   （Celery worker）
#   plane-beat      ./bin/docker-entrypoint-beat.sh     （Celery beat 调度）
#   plane-migrator  ./bin/docker-entrypoint-migrator.sh （一次性 migrate，跑完退出）
# 注意：Celery broker 是 RabbitMQ（Redis 仅作缓存），故必有 mq 服务
services:
  plane-web:
    image: makeplane/plane-frontend:stable
    container_name: plane-web
    restart: unless-stopped
    hostname: plane
    env_file: .env
    depends_on: [plane-api, plane-admin, plane-space, plane-live]
    ports:
      - "3000:3000"             # Web 统一入口（内网直连；镜像内 nginx 监听 3000）
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro   # 统一路由 /api /auth /god-mode /spaces /live
    networks:
      default: {}
      devops-internal:
        aliases:
          - plane               # 跨服务用 http://plane 访问

  plane-admin:
    image: makeplane/plane-admin:stable
    container_name: plane-admin
    restart: unless-stopped
    env_file: .env
    networks:
      default: {}

  plane-space:
    image: makeplane/plane-space:stable
    container_name: plane-space
    restart: unless-stopped
    env_file: .env
    networks:
      default: {}

  plane-live:
    image: makeplane/plane-live:stable
    container_name: plane-live
    restart: unless-stopped
    env_file: .env
    networks:
      default: {}

  plane-api:
    image: makeplane/plane-backend:stable
    container_name: plane-api
    restart: unless-stopped
    env_file: .env
    depends_on: [postgres, redis, minio, mq]
    volumes:
      - ${PLANE_DATA_DIR:-./data}/logs:/tmp
    networks:
      default: {}

  plane-worker:
    image: makeplane/plane-backend:stable
    container_name: plane-worker
    restart: unless-stopped
    command: ./bin/docker-entrypoint-worker.sh
    env_file: .env
    depends_on: [plane-api, postgres, redis, minio, mq]
    networks:
      default: {}

  plane-beat:
    image: makeplane/plane-backend:stable
    container_name: plane-beat
    restart: unless-stopped
    command: ./bin/docker-entrypoint-beat.sh
    env_file: .env
    depends_on: [plane-api, postgres, redis, minio, mq]
    networks:
      default: {}

  plane-migrator:
    image: makeplane/plane-backend:stable
    container_name: plane-migrator
    restart: "no"
    command: ./bin/docker-entrypoint-migrator.sh
    env_file: .env
    depends_on: [postgres, redis, mq]
    networks:
      default: {}

  postgres:
    image: postgres:15-alpine
    container_name: plane-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: plane
      POSTGRES_USER: plane
      POSTGRES_PASSWORD: ${PGPASSWORD}
    volumes:
      - ${PLANE_DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    networks:
      default: {}

  redis:
    image: redis:7-alpine
    container_name: plane-redis
    restart: unless-stopped
    volumes:
      - ${PLANE_DATA_DIR:-./data}/redis:/data
    networks:
      default: {}

  mq:
    image: rabbitmq:3.13.6-alpine
    container_name: plane-mq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - ${PLANE_DATA_DIR:-./data}/rabbitmq:/var/lib/rabbitmq
    networks:
      default: {}

  minio:
    image: minio/minio:latest
    container_name: plane-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      - ${PLANE_DATA_DIR:-./data}/minio:/data
    networks:
      default: {}

networks:
  default: {}
  devops-internal:
    external: true
