# GitLab — 单容器模式（内置 PostgreSQL/Redis，官方推荐）
# 2026-08-15 更新：改用官方单容器模式（内置 PG/Redis，版本匹配由镜像保证，
#   省去外置 PG/Redis 的版本维护负担）；镜像锁 19.1.3-ce.0（当前 latest stable）
#
# 端口：
#   8080:80  Web（灰灰指定开放 8080；容器内 nginx 监听 80）
#   2222:22  SSH Git（git clone ssh://git@192.168.199.131:2222/...）
# 数据：三个卷 bind mount 到 ${GITLAB_DATA_DIR:-./data}/{config,logs,app}
#   config → /etc/gitlab（含 gitlab.rb + secrets，备份重点）
#   logs   → /var/log/gitlab
#   app    → /var/opt/gitlab（内置 PG/Redis/仓库数据，最重）
# 网络：devops-internal(alias gitlab)，无外置依赖，完全自包含
# 升级：先 gitlab-backup create → 改 image tag → compose up -d → 跑内置 migrate
services:
  gitlab:
    image: gitlab/gitlab-ce:19.1.3-ce.0
    container_name: gitlab
    hostname: gitlab
    restart: unless-stopped
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://192.168.199.131:8080'
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
        gitlab_shell_ssh_port = 2222
    env_file: .env
    ports:
      - "8080:80"
      - "2222:22"
    volumes:
      - ${GITLAB_DATA_DIR:-./data}/config:/etc/gitlab
      - ${GITLAB_DATA_DIR:-./data}/logs:/var/log/gitlab
      - ${GITLAB_DATA_DIR:-./data}/app:/var/opt/gitlab
    shm_size: 256m
    networks:
      default: {}
      devops-internal:
        aliases:
          - gitlab

networks:
  default: {}
  devops-internal:
    external: true
